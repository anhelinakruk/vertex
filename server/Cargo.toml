[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
axum-extra = { version = "0.9", features = ["typed-header", "cookie"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
alloy = { version = "0.7", features = ["signers", "signer-local"] }
anyhow = "1.0"
surrealdb = { version = "2.1", default-features = false, features = ["protocol-ws"] }
dotenvy = "0.15"
siwe = "0.6"
jsonwebtoken = "9.3"
chrono = "0.4"
